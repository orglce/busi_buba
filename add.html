<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dodaj/uredi vnos bolezni</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
</head>
<body>
  <main>
    <h1>Dodaj ali uredi vnos bolezni</h1>
    <form id="sickness-form">
      <div id="date-display"></div>
      <input type="hidden" name="date" id="date-input">
      <label>Kaj Ajdo buba?
        <input type="text" name="sickness_type" required placeholder="">
      </label><br>
      <label>Opombe: <textarea name="notes"></textarea></label><br>
      <button type="submit">Shrani vnos</button>
    </form>
    <button id="back-btn" onclick="window.location.href='index.html'">Nazaj na koledar</button>
  </main>
  <script src="app.js"></script>
  <script>
const urlParams = new URLSearchParams(window.location.search);
const dateParam = urlParams.get('date');
const editId = urlParams.get('id');
const dateInput = document.getElementById('date-input');
const dateDisplay = document.getElementById('date-display');
if (!editId && dateParam) {
  dateInput.value = dateParam;
  dateDisplay.textContent = `Izbran datum: ${dateParam}`;
}
  </script>
</body>
</html>
